name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-cache:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    continue-on-error: true
    strategy:
      matrix:
        env_variant: [omp]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Spack
      uses: spack/setup-spack@v2

    - name: Install
      run: spack -e spack/proxy-geos-${{ matrix.env_variant }} install --no-check-signature

    - name: Push packages and update index
      run: |
        spack -e . mirror set --push --oci-username ${{ github.actor }} --oci-password "${{ secrets.GITHUB_TOKEN }}" local-buildcache
        spack -e . buildcache push --base-image ubuntu:24.04 --unsigned --update-index local-buildcache
      if: ${{ !cancelled() }}

  build:
    needs: build-cache
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      matrix:
        env_variant: [omp]
        preset: [default, kokkos]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Spack
      uses: spack/setup-spack@v2


    - name: Configure CMake
      shell: spack-bash
      run: |
        spack env activate spack/proxy-geos-${{ matrix.env_variant }}
        cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }}

    - name: Test
      run: ctest --preset ${{ matrix.preset }}
    